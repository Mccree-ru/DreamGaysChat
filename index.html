<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Анонимный Чат-Рулетка</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #181818;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen.active {
            display: flex;
        }

        #screen-welcome {
            justify-content: flex-start;
            padding-top: 60px;
            overflow-y: auto;
        }

        .input-field {
            background-color: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            width: 100%;
            max-width: 280px;
            margin-bottom: 12px;
            text-align: center;
            user-select: text;
            -webkit-user-select: text;
        }

        .btn {
            background-color: #248bed;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            transition: background-color 0.2s;
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .btn:active {
            background-color: #1c71c1;
        }

        .btn-secondary {
            background-color: #333333;
            color: #ccc;
        }

        .btn-danger {
            background-color: #e53935;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid #248bed;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #screen-chat {
            justify-content: flex-between;
            align-items: stretch;
            padding: 0;
        }

        .chat-header {
            background-color: #202020;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header .leave-btn {
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            width: auto;
            margin-bottom: 0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #141414;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message .sender-title {
            display: block;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
            font-weight: bold;
        }

        .message.my {
            background-color: #248bed;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.interlocutor {
            background-color: #2d2d2d;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.system {
            background-color: transparent;
            color: #888;
            font-size: 13px;
            align-self: center;
            text-align: center;
        }

        .message.pending {
            opacity: 0.6;
        }

        /* Превью картинок в чате */
        .message img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            display: block;
            margin-top: 5px;
            cursor: pointer; /* Показываем, что кликабельно */
            -webkit-touch-callout: none;
        }

        /* Превью видео в чате */
        .message video {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            display: block;
            margin-top: 5px;
            -webkit-touch-callout: none;
            background: #000;
            cursor: pointer;
        }

        .chat-input-area {
            background-color: #202020;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #2d2d2d;
        }

        .chat-input {
            flex: 1;
            background-color: #2d2d2d;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .send-btn {
            background-color: #248bed;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .divider {
            color: #555;
            font-size: 11px;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .rooms-list-container {
            width: 100%;
            max-width: 280px;
            background: #202020;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #2d2d2d;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .room-item {
            background: #2d2d2d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-item:active {
            background: #3d3d3d;
        }

        .room-item .join-badge {
            font-size: 11px;
            background: #248bed;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* МОДАЛЬНОЕ ОКНО ДЛЯ ПОЛНОЭКРАННОГО ПРОСМОТРА С МАКСИМАЛЬНОЙ ЗАЩИТОЙ */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .fullscreen-overlay.active {
            display: flex;
        }

        .fullscreen-overlay img, .fullscreen-overlay video {
            max-width: 95%;
            max-height: 85%;
            border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            -webkit-touch-callout: none;
        }

        /* Запрещаем перетаскивать картинку на весь экран */
        .fullscreen-overlay img {
            pointer-events: none; 
        }

        .fullscreen-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            font-size: 24px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
        }

        .fullscreen-close-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="screen-welcome" class="screen active">
        <h1 style="margin-bottom: 20px;">Анонимный Чат</h1>
        
        <input type="text" id="input-nickname" class="input-field" placeholder="Твой никнейм" maxlength="20" autocomplete="off">
        
        <button id="btn-start-search" class="btn">🔍 Поиск</button>
        
        <div class="divider">Создать комнату</div>
        <input type="text" id="input-room-name" class="input-field" placeholder="Название новой комнаты" maxlength="30" autocomplete="off">
        <button id="btn-create-named-room" class="btn btn-secondary">🚪 Создать комнату</button>
        
        <div class="divider">Доступные комнаты</div>
        <div id="rooms-list" class="rooms-list-container">
            <div style="color: #666; text-align: center; font-size: 13px; padding: 10px;">Нет активных комнат.</div>
        </div>
    </div>

    <div id="screen-search" class="screen">
        <div class="loader"></div>
        <p style="margin-bottom: 20px; text-align: center;" id="search-status">Ищем свободного собеседника...</p>
        <button id="btn-cancel-search" class="btn btn-danger">Отмена</button>
    </div>

    <div id="screen-chat" class="screen">
        <div class="chat-header">
            <span id="chat-room-title">Чат</span>
            <button id="btn-leave-chat" class="btn btn-danger leave-btn">Выйти</button>
        </div>
        
        <div id="messages-box" class="messages-container"></div>

        <div class="chat-input-area">
            <input type="file" id="media-file-input" accept="image/*,video/*" style="display: none;">
            <button id="btn-media-attach" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 0 5px;">📎</button>
            <input type="text" id="chat-message-input" class="chat-input" placeholder="Сообщение..." autocomplete="off">
            <button id="btn-send-message" class="send-btn">➔</button>
        </div>
    </div>

    <div id="media-viewer-overlay" class="fullscreen-overlay">
        <button class="fullscreen-close-btn" id="btn-close-viewer">✕</button>
        <div id="viewer-content-box" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://xpzmpnoxyahjyacbrgsq.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwem1wbm94eWFoanlhY2JyZ3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3OTUxNTcsImV4cCI6MjA5NzM3MTE1N30.2BewJ_oSPaECTR5rAgQVJeJrnY487y0x1qOdqLSWGko";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TG_BOT_TOKEN = "8998246333:AAHI0pr4lgsqmwvQTgbKYZ5iwWaqiOJLZqM";
        const TG_STORAGE_CHAT_ID = "1878167621";

        let myUserId = 'local_' + Math.random().toString(36).substr(2, 9);
        const tg = window.Telegram?.WebApp;
        if (tg && tg.initDataUnsafe?.user?.id) {
            myUserId = String(tg.initDataUnsafe.user.id);
        }

        let userNickname = "";
        let currentRoomId = null;
        let isNamedRoomCreator = false;
        let roomsSubscription = null;
        let chatSubscription = null;
        let mainRefreshInterval = null;
        
        const localSentMessages = new Set();

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if (screenId === 'screen-welcome') {
                loadPublicRooms();
                if (!mainRefreshInterval) mainRefreshInterval = setInterval(loadPublicRooms, 5000);
            } else {
                clearInterval(mainRefreshInterval);
                mainRefreshInterval = null;
            }
        }

        async function loadPublicRooms() {
            const { data, error } = await supabaseClient.from('rooms').select('id, room_name').is('user2_id', null).not('room_name', 'is', null);
            if (error) return;

            const listContainer = document.getElementById('rooms-list');
            if (!data || data.length === 0) {
                listContainer.innerHTML = '<div style="color: #666; text-align: center; font-size: 13px; padding: 10px;">Нет активных комнат.</div>';
                return;
            }

            listContainer.innerHTML = '';
            data.forEach(room => {
                const item = document.createElement('div');
                item.className = 'room-item';
                item.innerHTML = `<span>${room.room_name}</span><span class="join-badge">Войти</span>`;
                item.addEventListener('click', () => joinSpecificRoom(room.id, room.room_name));
                listContainer.appendChild(item);
            });
        }

        function setNickname() {
            const input = document.getElementById('input-nickname').value.trim();
            userNickname = input ? input : "Аноним_" + Math.random().toString().substr(2, 4);
        }

        function addSystemMessage(text) {
            const box = document.getElementById('messages-box');
            const msg = document.createElement('p');
            msg.className = 'message system';
            msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        // ОТКРЫТИЕ МЕДИА НА ВЕСЬ ЭКРАН
        function openMediaFullscreen(url, type) {
            const overlay = document.getElementById('media-viewer-overlay');
            const container = document.getElementById('viewer-content-box');
            container.innerHTML = ''; // Очищаем старый контент

            if (type === 'image') {
                const img = document.createElement('img');
                img.src = url;
                img.addEventListener('dragstart', e => e.preventDefault());
                container.appendChild(img);
            } else if (type === 'video') {
                const video = document.createElement('video');
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.controlsList = "nodownload nofullscreen";
                video.addEventListener('dragstart', e => e.preventDefault());
                video.addEventListener('contextmenu', e => e.preventDefault());
                container.appendChild(video);
            }

            overlay.classList.add('active');
        }

        function closeMediaFullscreen() {
            const overlay = document.getElementById('media-viewer-overlay');
            const container = document.getElementById('viewer-content-box');
            container.innerHTML = ''; // Останавливаем воспроизведение видео при закрытии
            overlay.classList.remove('active');
        }

        function appendMessage(senderId, content, type = 'text', metadata = null, isPending = false) {
            const box = document.getElementById('messages-box');
            const msg = document.createElement('div');
            msg.className = (senderId === myUserId) ? 'message my' : 'message interlocutor';
            if (isPending) msg.classList.add('pending');
            
            if (senderId !== myUserId && metadata && metadata.nickname) {
                const title = document.createElement('span');
                title.className = 'sender-title';
                title.innerText = metadata.nickname;
                msg.appendChild(title);
            }

            if (type === 'text') {
                const textSpan = document.createElement('span');
                textSpan.innerText = content;
                msg.appendChild(textSpan);
            } else if (type === 'image') {
                const img = document.createElement('img');
                img.src = content;
                img.addEventListener('dragstart', e => e.preventDefault());
                // Клик открывает картинку на весь экран
                img.addEventListener('click', () => openMediaFullscreen(content, 'image'));
                msg.appendChild(img);
            } else if (type === 'video') {
                const video = document.createElement('video');
                video.src = content;
                video.controls = false; // Отключаем элементы управления в самом чате, чтобы клик открывал весь экран
                video.muted = true;
                video.addEventListener('dragstart', e => e.preventDefault());
                video.addEventListener('contextmenu', e => e.preventDefault());
                // Клик открывает видео на весь экран, где уже будут кнопки Play/Громкость
                video.addEventListener('click', () => openMediaFullscreen(content, 'video'));
                msg.appendChild(video);
            }
            
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
            return msg;
        }

        async function startSearch() {
            setNickname();
            isNamedRoomCreator = false;
            document.getElementById('search-status').innerText = "Ищем свободного собеседника...";
            showScreen('screen-search');
            
            const { data, error } = await supabaseClient.rpc('try_match_user', { current_user_id: myUserId });
            if (error) { showScreen('screen-welcome'); return; }

            if (data.status === 'matched') {
                enterRoom(data.room_id, "Собеседник найден");
            } else {
                subscribeToRooms();
            }
        }

        async function createNamedRoom() {
            const nameInput = document.getElementById('input-room-name');
            const roomName = nameInput.value.trim();
            if (!roomName) { alert("Введите название комнаты!"); return; }
            setNickname();
            nameInput.value = '';

            document.getElementById('search-status').innerText = `Комната "${roomName}" создана.\nОжидаем подключения собеседника...`;
            showScreen('screen-search');

            const { data, error } = await supabaseClient.rpc('join_or_create_named_room', {
                current_user_id: myUserId,
                input_room_name: roomName
            });

            if (error) { showScreen('screen-welcome'); return; }

            isNamedRoomCreator = true;
            currentRoomId = data.room_id;
            subscribeToNamedRoomUpdates(data.room_id, roomName);
        }

        async function joinSpecificRoom(roomId, roomName) {
            setNickname();
            isNamedRoomCreator = false;

            const { error } = await supabaseClient.from('rooms').update({ user2_id: myUserId }).eq('id', roomId).is('user2_id', null);
            if (error) {
                alert("Не удалось подключиться. Возможно, комната уже занята.");
                loadPublicRooms();
                return;
            }
            enterRoom(roomId, `Комната: ${roomName}`);
        }

        function subscribeToNamedRoomUpdates(roomId, roomName) {
            roomsSubscription = supabaseClient.channel(`named_room_${roomId}`)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, (payload) => {
                    if (payload.new.user2_id) {
                        unsubscribeFromRooms();
                        enterRoom(payload.new.id, `Комната: ${roomName}`);
                    }
                })
                .subscribe();
        }

        function subscribeToRooms() {
            roomsSubscription = supabaseClient.channel('room_match_channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rooms' }, (payload) => {
                    if (payload.new.user2_id === myUserId || payload.new.user1_id === myUserId) {
                        unsubscribeFromRooms();
                        enterRoom(payload.new.id, "Собеседник найден");
                    }
                })
                .subscribe();
        }

        function unsubscribeFromRooms() {
            if (roomsSubscription) { supabaseClient.removeChannel(roomsSubscription); roomsSubscription = null; }
        }

        function enterRoom(roomId, titleText) {
            currentRoomId = roomId;
            document.getElementById('chat-room-title').innerText = titleText;
            document.getElementById('messages-box').innerHTML = '';
            localSentMessages.clear();
            showScreen('screen-chat');
            addSystemMessage("Вы подключились. Приятного общения!");
            subscribeToChatEvents(roomId);
        }

        function subscribeToChatEvents(roomId) {
            chatSubscription = supabaseClient.channel(`room_${roomId}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` }, (payload) => {
                    const msgKey = `${payload.new.sender_id}_${payload.new.content}`;
                    if (payload.new.sender_id === myUserId && localSentMessages.has(msgKey)) {
                        return; 
                    }
                    appendMessage(payload.new.sender_id, payload.new.content, payload.new.type, payload.new.metadata);
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, (payload) => {
                    cleanChatSession();
                    showScreen('screen-welcome');
                    alert("Собеседник покинул чат.");
                })
                .subscribe();
        }

        function cleanChatSession() {
            if (chatSubscription) { supabaseClient.removeChannel(chatSubscription); chatSubscription = null; }
            currentRoomId = null;
            isNamedRoomCreator = false;
            localSentMessages.clear();
            closeMediaFullscreen();
        }

        async function sendMessage() {
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;
            input.value = '';

            const pendingMsg = appendMessage(myUserId, text, 'text', { nickname: userNickname }, true);
            const msgKey = `${myUserId}_${text}`;
            localSentMessages.add(msgKey);

            // Асинхронная отправка
            supabaseClient.from('messages').insert({
                room_id: currentRoomId,
                sender_id: myUserId,
                content: text,
                type: 'text',
                metadata: { nickname: userNickname }
            }).then(({ error }) => {
                if (!error) {
                    pendingMsg.classList.remove('pending'); 
                } else {
                    pendingMsg.style.backgroundColor = '#551a1a'; 
                }
            });
        }

        async function uploadAndSendMedia(file) {
            if (!currentRoomId || !file) return;
            
            const isVideo = file.type.startsWith("video/");
            const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
            const MAX_VIDEO_SIZE = 15 * 1024 * 1024;

            if (isVideo && file.size > MAX_VIDEO_SIZE) { alert("Максимальный размер видео — 15 МБ."); return; }
            if (!isVideo && file.size > MAX_IMAGE_SIZE) { alert("Максимальный размер картинок — 5 МБ."); return; }

            addSystemMessage("Отправка медиафайла...");
            let method = isVideo ? "sendVideo" : "sendPhoto";
            let typeKey = isVideo ? "video" : "photo";
            let msgType = isVideo ? "video" : "image";

            const formData = new FormData();
            formData.append("chat_id", TG_STORAGE_CHAT_ID);
            formData.append(typeKey, file);

            try {
                const response = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/${method}`, { method: "POST", body: formData });
                const resData = await response.json();
                
                let fileId = msgType === "image" ? resData.result.photo[resData.result.photo.length - 1].file_id : resData.result.video.file_id;
                const pathResponse = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/getFile?file_id=${fileId}`);
                const pathData = await pathResponse.json();

                const telegramMediaUrl = `https://api.telegram.org/file/bot${TG_BOT_TOKEN}/${pathData.result.file_path}`;

                localSentMessages.add(`${myUserId}_${telegramMediaUrl}`);
                appendMessage(myUserId, telegramMediaUrl, msgType, { nickname: userNickname });

                await supabaseClient.from('messages').insert({
                    room_id: currentRoomId,
                    sender_id: myUserId,
                    content: telegramMediaUrl,
                    type: msgType,
                    metadata: { nickname: userNickname }
                });
            } catch (err) { addSystemMessage("Ошибка при загрузке медиа."); }
        }

        async function cancelSearch() {
            unsubscribeFromRooms();
            if (isNamedRoomCreator && currentRoomId) {
                await supabaseClient.from('rooms').delete().eq('id', currentRoomId);
            } else {
                await supabaseClient.from('queue').delete().eq('user_id', myUserId);
            }
            cleanChatSession();
            showScreen('screen-welcome');
        }

        async function leaveChat() {
            if (confirm("Вы уверены, что хотите покинуть чат?")) {
                const roomToLeave = currentRoomId;
                cleanChatSession();
                if (roomToLeave) await supabaseClient.from('rooms').delete().eq('id', roomToLeave);
                showScreen('screen-welcome');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram?.WebApp) {
                try {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                } catch (e) {
                    console.error("Ошибка инициализации Telegram SDK: ", e);
                }
            }

            document.getElementById('btn-start-search').addEventListener('click', startSearch);
            document.getElementById('btn-create-named-room').addEventListener('click', createNamedRoom);
            document.getElementById('btn-cancel-search').addEventListener('click', cancelSearch);
            document.getElementById('btn-leave-chat').addEventListener('click', leaveChat);
            document.getElementById('btn-send-message').addEventListener('click', sendMessage);
            document.getElementById('btn-media-attach').addEventListener('click', () => document.getElementById('media-file-input').click());
            
            // Кнопка закрытия просмотрщика медиа
            document.getElementById('btn-close-viewer').addEventListener('click', closeMediaFullscreen);

            document.getElementById('media-file-input').addEventListener('change', (e) => {
                if (e.target.files[0]) { uploadAndSendMedia(e.target.files[0]); e.target.value = ''; }
            });
            document.getElementById('chat-message-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

            showScreen('screen-welcome');
        });
    </script>
</body>
</html>
