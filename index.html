<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Анонимная Чат-Рулетка</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #181818;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen.active {
            display: flex;
        }

        #screen-welcome {
            justify-content: flex-start;
            padding-top: 20px;
            overflow-y: auto;
        }

        #screen-chat-ended {
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        #screen-chat-ended .end-message {
            font-size: 18px;
            color: #888;
            text-align: center;
            max-width: 280px;
        }

        .search-status-widget {
            display: none;
            width: 100%;
            max-width: 280px;
            background: #2a3b4c;
            border: 1px solid #375a7f;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            animation: fadeIn 0.3s ease;
        }
        
        .search-status-widget.active {
            display: flex;
        }

        .search-status-widget .widget-loader {
            border: 3px solid #333;
            border-top: 3px solid #248bed;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }

        .search-status-widget .widget-text {
            font-size: 13px;
            flex: 1;
            line-height: 1.3;
        }

        .search-status-widget .widget-cancel-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-field {
            background-color: #2d2d2d;
            border: 1px solid #3d3d3d;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            width: 100%;
            max-width: 280px;
            margin-bottom: 12px;
            text-align: center;
            user-select: text;
            -webkit-user-select: text;
        }

        .btn {
            background-color: #248bed;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            transition: background-color 0.2s;
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .btn:disabled {
            background-color: #444 !important;
            color: #aaa;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn:active:not(:disabled) {
            background-color: #1c71c1;
        }

        .btn-secondary {
            background-color: #333333;
            color: #ccc;
        }

        .btn-danger {
            background-color: #e53935;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #screen-chat {
            justify-content: flex-between;
            align-items: stretch;
            padding: 0;
        }

        .chat-header {
            background-color: #202020;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header .leave-btn {
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            width: auto;
            margin-bottom: 0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #141414;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message .sender-title {
            display: block;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
            font-weight: bold;
        }

        .message.my {
            background-color: #248bed;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.interlocutor {
            background-color: #2d2d2d;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.system {
            background-color: transparent;
            color: #888;
            font-size: 13px;
            align-self: center;
            text-align: center;
        }

        .message.system-end {
            background-color: transparent;
            color: #ff6b6b;
            font-size: 15px;
            align-self: center;
            text-align: center;
            font-weight: bold;
            padding: 20px;
        }

        .message.pending {
            opacity: 0.6;
        }

        .message img, .message video {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            display: block;
            margin-top: 5px;
            cursor: pointer;
            -webkit-touch-callout: none;
        }

        .message video {
            background: #000;
        }

        .chat-input-area {
            background-color: #202020;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #2d2d2d;
        }

        .chat-input {
            flex: 1;
            background-color: #2d2d2d;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .send-btn {
            background-color: #248bed;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .divider {
            color: #555;
            font-size: 11px;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
            max-width: 280px;
        }

        .rooms-list-container {
            width: 100%;
            max-width: 280px;
            background: #202020;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #2d2d2d;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 5px;
            flex-shrink: 0;
        }

        .room-item {
            background: #2d2d2d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-item:active {
            background: #3d3d3d;
        }

        .room-item .join-badge {
            font-size: 11px;
            background: #248bed;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .fullscreen-overlay.active {
            display: flex;
        }

        .fullscreen-overlay img, .fullscreen-overlay video {
            max-width: 95%;
            max-height: 85%;
            border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            -webkit-touch-callout: none;
        }

        .fullscreen-overlay img {
            pointer-events: none; 
        }

        .fullscreen-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            font-size: 24px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div id="screen-welcome" class="screen active">
        <h1 style="margin-bottom: 15px;">Анонимный Чат</h1>
        
        <div id="search-widget" class="search-status-widget">
            <div class="widget-loader"></div>
            <span id="widget-status-text" class="widget-text">Ищем собеседника...</span>
            <button id="btn-widget-cancel" class="widget-cancel-btn">Отмена</button>
        </div>

        <input type="text" id="input-nickname" class="input-field" placeholder="Твой никнейм" maxlength="20" autocomplete="off">
        
        <button id="btn-start-search" class="btn">🔍 Поиск</button>
        
        <div class="divider">Создать комнату</div>
        <input type="text" id="input-room-name" class="input-field" placeholder="Название новой комнаты" maxlength="30" autocomplete="off">
        <button id="btn-create-named-room" class="btn btn-secondary">🚪 Создать комнату</button>
        
        <div class="divider">Доступные комнаты</div>
        <div id="rooms-list" class="rooms-list-container">
            <div style="color: #666; text-align: center; font-size: 13px; padding: 10px;">Нет активных комнат.</div>
        </div>
    </div>

    <div id="screen-chat" class="screen">
        <div class="chat-header">
            <span id="chat-room-title">Чат</span>
            <button id="btn-leave-chat" class="btn btn-danger leave-btn">Выйти</button>
        </div>
        
        <div id="messages-box" class="messages-container"></div>

        <div class="chat-input-area">
            <input type="file" id="media-file-input" accept="image/*,video/*" style="display: none;">
            <button id="btn-media-attach" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 0 5px;">📎</button>
            <input type="text" id="chat-message-input" class="chat-input" placeholder="Сообщение..." autocomplete="off">
            <button id="btn-send-message" class="send-btn">➔</button>
        </div>
    </div>

    <div id="screen-chat-ended" class="screen">
        <div class="end-message">💬 Чат завершен</div>
        <button id="btn-end-chat-exit" class="btn">Выйти в меню</button>
    </div>

    <div id="media-viewer-overlay" class="fullscreen-overlay">
        <button class="fullscreen-close-btn" id="btn-close-viewer">✕</button>
        <div id="viewer-content-box" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://xpzmpnoxyahjyacbrgsq.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwem1wbm94eWFoanlhY2JyZ3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3OTUxNTcsImV4cCI6MjA5NzM3MTE1N30.2BewJ_oSPaECTR5rAgQVJeJrnY487y0x1qOdqLSWGko";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TG_BOT_TOKEN = "8998246333:AAHI0pr4lgsqmwvQTgbKYZ5iwWaqiOJLZqM";

        let myUserId = 'local_' + Math.random().toString(36).substr(2, 9);
        const tg = window.Telegram?.WebApp;
        if (tg && tg.initDataUnsafe?.user?.id) {
            myUserId = String(tg.initDataUnsafe.user.id);
        }

        let userNickname = "";
        let currentRoomId = null;
        let isNamedRoomCreator = false;
        let roomsSubscription = null;
        let chatSubscription = null;
        let mainRefreshInterval = null;
        let isSearchingCurrently = false;
        let isCancelling = false;
        let knownRoomIds = new Set();
        const localSentMessages = new Set();
        let isChatEnded = false;

        // СИНТЕЗАТОР МИКРО-ЗВУКОВ НА WEB AUDIO API
        function playTone(frequency, duration, type = 'sine', delay = 0) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = type;
                    osc.frequency.setValueAtTime(frequency, ctx.currentTime);
                    
                    gain.gain.setValueAtTime(0.15, ctx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                }, delay * 1000);
            } catch (e) {
                console.log("Audio play blocked or unsupported:", e);
            }
        }

        function playSoundMessage() {
            playTone(600, 0.08, 'sine');
        }

        function playSoundMatch() {
            playTone(800, 0.1, 'sine');
            playTone(1000, 0.15, 'sine', 0.08);
        }

        function playSoundNewRoom() {
            playTone(440, 0.05, 'triangle');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if (screenId === 'screen-welcome') {
                loadPublicRooms(true);
                if (!mainRefreshInterval) {
                    mainRefreshInterval = setInterval(() => loadPublicRooms(false), 4000);
                }
            } else {
                if (mainRefreshInterval) {
                    clearInterval(mainRefreshInterval);
                    mainRefreshInterval = null;
                }
            }
        }

        async function loadPublicRooms(isFirstLoad = false) {
            try {
                const { data, error } = await supabaseClient.from('rooms')
                    .select('id, room_name, user1_id')
                    .is('user2_id', null)
                    .not('room_name', 'is', null);
                    
                if (error) return;

                const listContainer = document.getElementById('rooms-list');
                const availableRooms = data ? data.filter(r => r.user1_id !== myUserId) : [];

                if (!isFirstLoad && availableRooms.length > 0) {
                    let hasNew = false;
                    availableRooms.forEach(room => {
                        if (!knownRoomIds.has(room.id)) {
                            hasNew = true;
                        }
                    });
                    if (hasNew) {
                        playSoundNewRoom();
                    }
                }

                knownRoomIds.clear();
                availableRooms.forEach(r => knownRoomIds.add(r.id));

                if (availableRooms.length === 0) {
                    listContainer.innerHTML = '<div style="color: #666; text-align: center; font-size: 13px; padding: 10px;">Нет активных комнат.</div>';
                    return;
                }

                listContainer.innerHTML = '';
                availableRooms.forEach(room => {
                    const item = document.createElement('div');
                    item.className = 'room-item';
                    item.innerHTML = `<span>${room.room_name}</span><span class="join-badge">Войти</span>`;
                    item.addEventListener('click', () => joinSpecificRoom(room.id, room.room_name));
                    listContainer.appendChild(item);
                });
            } catch (error) {
                console.error('Error loading rooms:', error);
            }
        }

        function setNickname() {
            const input = document.getElementById('input-nickname').value.trim();
            userNickname = input ? input : "Аноним_" + Math.random().toString(36).substr(2, 4);
        }

        function addSystemMessage(text, isEnd = false) {
            const box = document.getElementById('messages-box');
            const msg = document.createElement('p');
            msg.className = isEnd ? 'message system-end' : 'message system';
            msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function openMediaFullscreen(url, type) {
            const overlay = document.getElementById('media-viewer-overlay');
            const container = document.getElementById('viewer-content-box');
            container.innerHTML = '';

            if (type === 'image') {
                const img = document.createElement('img');
                img.src = url;
                img.addEventListener('dragstart', e => e.preventDefault());
                container.appendChild(img);
            } else if (type === 'video') {
                const video = document.createElement('video');
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.controlsList = "nodownload nofullscreen";
                video.addEventListener('dragstart', e => e.preventDefault());
                video.addEventListener('contextmenu', e => e.preventDefault());
                container.appendChild(video);
            }

            overlay.classList.add('active');
        }

        function closeMediaFullscreen() {
            const overlay = document.getElementById('media-viewer-overlay');
            const container = document.getElementById('viewer-content-box');
            container.innerHTML = '';
            overlay.classList.remove('active');
        }

        function appendMessage(senderId, content, type = 'text', metadata = null, isPending = false) {
            const box = document.getElementById('messages-box');
            const msg = document.createElement('div');
            msg.className = (senderId === myUserId) ? 'message my' : 'message interlocutor';
            if (isPending) msg.classList.add('pending');
            
            if (senderId !== myUserId && metadata && metadata.nickname) {
                const title = document.createElement('span');
                title.className = 'sender-title';
                title.innerText = metadata.nickname;
                msg.appendChild(title);
            }

            if (type === 'text') {
                const textSpan = document.createElement('span');
                textSpan.innerText = content;
                msg.appendChild(textSpan);
            } else if (type === 'image') {
                const img = document.createElement('img');
                img.src = content;
                img.addEventListener('dragstart', e => e.preventDefault());
                img.addEventListener('click', () => openMediaFullscreen(content, 'image'));
                msg.appendChild(img);
            } else if (type === 'video') {
                const video = document.createElement('video');
                video.src = content;
                video.controls = false;
                video.muted = true;
                video.addEventListener('dragstart', e => e.preventDefault());
                video.addEventListener('contextmenu', e => e.preventDefault());
                video.addEventListener('click', () => openMediaFullscreen(content, 'video'));
                msg.appendChild(video);
            }
            
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
            return msg;
        }

        function toggleSearchWidget(active, text = "") {
            const widget = document.getElementById('search-widget');
            const btnSearch = document.getElementById('btn-start-search');
            const btnCreate = document.getElementById('btn-create-named-room');
            
            isSearchingCurrently = active;

            if (active) {
                document.getElementById('widget-status-text').innerText = text;
                widget.classList.add('active');
                btnSearch.disabled = true;
                btnCreate.disabled = true;
            } else {
                widget.classList.remove('active');
                btnSearch.disabled = false;
                btnCreate.disabled = false;
            }
        }

        async function startSearch() {
            if (isSearchingCurrently || isCancelling) return;
            
            setNickname();
            isNamedRoomCreator = false;
            toggleSearchWidget(true, "Ищем свободного собеседника...");
            
            try {
                const { data, error } = await supabaseClient.rpc('try_match_user', { current_user_id: myUserId });
                
                if (isCancelling || !isSearchingCurrently) {
                    return;
                }
                
                if (error) {
                    console.error('Match error:', error);
                    toggleSearchWidget(false);
                    return;
                }

                if (data && data.status === 'matched') {
                    toggleSearchWidget(false);
                    enterRoom(data.room_id, "Собеседник найден");
                } else {
                    subscribeToRooms();
                }
            } catch (error) {
                console.error('Error in startSearch:', error);
                toggleSearchWidget(false);
            }
        }

        async function createNamedRoom() {
            if (isSearchingCurrently || isCancelling) return;
            
            const nameInput = document.getElementById('input-room-name');
            const roomName = nameInput.value.trim();
            if (!roomName) { alert("Введите название комнаты!"); return; }
            setNickname();
            nameInput.value = '';

            toggleSearchWidget(true, `Комната "${roomName}" создана. Ожидаем подключения...`);

            try {
                const { data, error } = await supabaseClient.rpc('join_or_create_named_room', {
                    current_user_id: myUserId,
                    input_room_name: roomName
                });

                if (isCancelling || !isSearchingCurrently) {
                    return;
                }

                if (error) {
                    console.error('Create room error:', error);
                    toggleSearchWidget(false);
                    return;
                }

                isNamedRoomCreator = true;
                currentRoomId = data.room_id;
                subscribeToNamedRoomUpdates(data.room_id, roomName);
            } catch (error) {
                console.error('Error in createNamedRoom:', error);
                toggleSearchWidget(false);
            }
        }

        async function joinSpecificRoom(roomId, roomName) {
            if (isCancelling) return;
            
            setNickname();
            
            if (isSearchingCurrently) {
                await silentCancelSearch();
                toggleSearchWidget(false);
            }

            isNamedRoomCreator = false;

            try {
                const { error } = await supabaseClient.from('rooms')
                    .update({ user2_id: myUserId })
                    .eq('id', roomId)
                    .is('user2_id', null);
                    
                if (error) {
                    alert("Не удалось подключиться. Возможно, комната уже занята.");
                    loadPublicRooms(true);
                    return;
                }
                enterRoom(roomId, `Комната: ${roomName}`);
            } catch (error) {
                console.error('Error in joinSpecificRoom:', error);
                alert("Ошибка подключения к комнате");
            }
        }

        function subscribeToNamedRoomUpdates(roomId, roomName) {
            if (roomsSubscription) {
                supabaseClient.removeChannel(roomsSubscription);
                roomsSubscription = null;
            }
            
            roomsSubscription = supabaseClient.channel(`named_room_${roomId}`)
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'rooms', 
                    filter: `id=eq.${roomId}` 
                }, (payload) => {
                    if (payload.new.user2_id && !isCancelling) {
                        unsubscribeFromRooms();
                        toggleSearchWidget(false);
                        enterRoom(payload.new.id, `Комната: ${roomName}`);
                    }
                })
                .subscribe();
        }

        function subscribeToRooms() {
            if (roomsSubscription) {
                supabaseClient.removeChannel(roomsSubscription);
                roomsSubscription = null;
            }
            
            roomsSubscription = supabaseClient.channel('room_match_channel')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'rooms' 
                }, (payload) => {
                    if (!isCancelling && (payload.new.user2_id === myUserId || payload.new.user1_id === myUserId)) {
                        unsubscribeFromRooms();
                        toggleSearchWidget(false);
                        enterRoom(payload.new.id, "Собеседник найден");
                    }
                })
                .subscribe();
        }

        function unsubscribeFromRooms() {
            if (roomsSubscription) {
                try {
                    supabaseClient.removeChannel(roomsSubscription);
                } catch (e) {
                    console.error('Error removing rooms subscription:', e);
                }
                roomsSubscription = null;
            }
        }

        function enterRoom(roomId, titleText) {
            currentRoomId = roomId;
            isChatEnded = false;
            document.getElementById('chat-room-title').innerText = titleText;
            document.getElementById('messages-box').innerHTML = '';
            localSentMessages.clear();
            showScreen('screen-chat');
            addSystemMessage("Вы подключились. Приятного общения!");
            
            playSoundMatch();
            
            subscribeToChatEvents(roomId);
        }

        function showChatEndedScreen() {
            cleanChatSession();
            showScreen('screen-chat-ended');
        }

        function subscribeToChatEvents(roomId) {
            if (chatSubscription) {
                supabaseClient.removeChannel(chatSubscription);
                chatSubscription = null;
            }
            
            chatSubscription = supabaseClient.channel(`room_${roomId}`)
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'messages', 
                    filter: `room_id=eq.${roomId}` 
                }, (payload) => {
                    if (payload.new.type === 'system_leave') {
                        // Собеседник вышел
                        if (payload.new.sender_id !== myUserId) {
                            addSystemMessage("Собеседник завершил чат", true);
                            // Показываем кнопку выхода через 2 секунды
                            setTimeout(() => {
                                showChatEndedScreen();
                            }, 2000);
                        }
                        return;
                    }

                    const msgKey = `${payload.new.sender_id}_${payload.new.content}`;
                    if (payload.new.sender_id === myUserId && localSentMessages.has(msgKey)) {
                        return; 
                    }
                    
                    if (payload.new.sender_id !== myUserId) {
                        playSoundMessage();
                    }

                    appendMessage(payload.new.sender_id, payload.new.content, payload.new.type, payload.new.metadata);
                })
                .on('postgres_changes', { 
                    event: 'DELETE', 
                    schema: 'public', 
                    table: 'rooms', 
                    filter: `id=eq.${roomId}` 
                }, (payload) => {
                    if (currentRoomId === roomId && !isChatEnded) {
                        showChatEndedScreen();
                    }
                })
                .subscribe();
        }

        function cleanChatSession() {
            if (chatSubscription) {
                try {
                    supabaseClient.removeChannel(chatSubscription);
                } catch (e) {
                    console.error('Error removing chat subscription:', e);
                }
                chatSubscription = null;
            }
            unsubscribeFromRooms();
            currentRoomId = null;
            isNamedRoomCreator = false;
            localSentMessages.clear();
            closeMediaFullscreen();
            isCancelling = false;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;
            input.value = '';

            const pendingMsg = appendMessage(myUserId, text, 'text', { nickname: userNickname }, true);
            const msgKey = `${myUserId}_${text}`;
            localSentMessages.add(msgKey);

            try {
                const { error } = await supabaseClient.from('messages').insert({
                    room_id: currentRoomId,
                    sender_id: myUserId,
                    content: text,
                    type: 'text',
                    metadata: { nickname: userNickname }
                });
                
                if (error) {
                    pendingMsg.style.backgroundColor = '#551a1a';
                    console.error('Error sending message:', error);
                } else {
                    pendingMsg.classList.remove('pending');
                }
            } catch (error) {
                pendingMsg.style.backgroundColor = '#551a1a';
                console.error('Error sending message:', error);
            }
        }

        async function uploadAndSendMedia(file) {
            if (!currentRoomId || !file) return;
            
            const isVideo = file.type.startsWith("video/");
            const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
            const MAX_VIDEO_SIZE = 15 * 1024 * 1024;
        
            if (isVideo && file.size > MAX_VIDEO_SIZE) { 
                alert("Максимальный размер видео — 15 МБ."); 
                return; 
            }
            if (!isVideo && file.size > MAX_IMAGE_SIZE) { 
                alert("Максимальный размер картинок — 5 МБ."); 
                return; 
            }
        
            addSystemMessage("Отправка медиафайла...");
            let method = isVideo ? "sendVideo" : "sendPhoto";
            let typeKey = isVideo ? "video" : "photo";
            let msgType = isVideo ? "video" : "image";
        
            const formData = new FormData();
            formData.append("chat_id", "-1003536471476");
            formData.append(typeKey, file);
        
            try {
                const response = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/${method}`, { 
                    method: "POST", 
                    body: formData 
                });
                const resData = await response.json();
                
                if (!resData.ok) {
                    addSystemMessage("Ошибка Telegram: " + resData.description);
                    return;
                }
                
                let fileId = msgType === "image" ? 
                    resData.result.photo[resData.result.photo.length - 1].file_id : 
                    resData.result.video.file_id;
                    
                const pathResponse = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/getFile?file_id=${fileId}`);
                const pathData = await pathResponse.json();
        
                const telegramMediaUrl = `https://api.telegram.org/file/bot${TG_BOT_TOKEN}/${pathData.result.file_path}`;
        
                localSentMessages.add(`${myUserId}_${telegramMediaUrl}`);
                appendMessage(myUserId, telegramMediaUrl, msgType, { nickname: userNickname });
        
                await supabaseClient.from('messages').insert({
                    room_id: currentRoomId,
                    sender_id: myUserId,
                    content: telegramMediaUrl,
                    type: msgType,
                    metadata: { nickname: userNickname }
                });
            } catch (err) { 
                addSystemMessage("Ошибка при загрузке медиа."); 
                console.error('Error uploading media:', err);
            }
        }

        async function cancelSearchButtonClicked() {
            if (isCancelling) return;
            isCancelling = true;
            
            try {
                await silentCancelSearch();
                toggleSearchWidget(false);
            } catch (error) {
                console.error('Error cancelling search:', error);
                toggleSearchWidget(false);
            } finally {
                isCancelling = false;
            }
        }

        async function silentCancelSearch() {
            unsubscribeFromRooms();
            
            try {
                if (isNamedRoomCreator && currentRoomId) {
                    await supabaseClient.from('rooms').delete().eq('id', currentRoomId);
                } else {
                    await supabaseClient.from('queue').delete().eq('user_id', myUserId);
                }
            } catch (error) {
                console.error('Error during silent cancel search:', error);
            }
            
            currentRoomId = null;
            isNamedRoomCreator = false;
            isSearchingCurrently = false;
        }

        async function leaveChat() {
            if (!confirm("Вы уверены, что хотите покинуть чат?")) return;
            
            const roomToLeave = currentRoomId;
            isChatEnded = true;
            
            if (roomToLeave) {
                try {
                    // Отправляем сообщение о выходе
                    await supabaseClient.from('messages').insert({
                        room_id: roomToLeave,
                        sender_id: myUserId,
                        content: 'Пользователь завершил чат',
                        type: 'system_leave',
                        metadata: { nickname: userNickname }
                    });
                    
                    // Удаляем комнату
                    await supabaseClient.from('rooms').delete().eq('id', roomToLeave);
                    await supabaseClient.from('queue').delete().eq('user_id', myUserId);
                    
                } catch (error) {
                    console.error('Error during leave chat:', error);
                }
            }
            
            cleanChatSession();
            showScreen('screen-welcome');
        }

        function exitFromEndedChat() {
            cleanChatSession();
            showScreen('screen-welcome');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram?.WebApp) {
                try {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                } catch (e) {
                    console.error("Ошибка инициализации Telegram SDK: ", e);
                }
            }

            document.getElementById('btn-start-search').addEventListener('click', startSearch);
            document.getElementById('btn-create-named-room').addEventListener('click', createNamedRoom);
            document.getElementById('btn-widget-cancel').addEventListener('click', cancelSearchButtonClicked);
            document.getElementById('btn-leave-chat').addEventListener('click', leaveChat);
            document.getElementById('btn-end-chat-exit').addEventListener('click', exitFromEndedChat);
            document.getElementById('btn-send-message').addEventListener('click', sendMessage);
            document.getElementById('btn-media-attach').addEventListener('click', () => document.getElementById('media-file-input').click());
            document.getElementById('btn-close-viewer').addEventListener('click', closeMediaFullscreen);

            document.getElementById('media-file-input').addEventListener('change', (e) => {
                if (e.target.files[0]) { 
                    uploadAndSendMedia(e.target.files[0]); 
                    e.target.value = ''; 
                }
            });
            
            document.getElementById('chat-message-input').addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') sendMessage(); 
            });

            showScreen('screen-welcome');
        });
    </script>
</body>
</html>
